[workspace]
members = [
    "crates/tuiscotti",
    "crates/tuiscotti-cli",
]
resolver = "3"

[workspace.dependencies]
# Centralize all actual dependencies here, including dev/build dependencies.
# D07: only the two shipping crates remain. Live PTY work belongs to
# `tui-test-rs` (provisional pinned fork commit per D-R02-1, never the
# last vendor dependency);
# tuiscotti keeps no local PTY dependency. Compatible SemVer ranges let
# downstream consumers unify dependencies without forced downgrades,
# while Cargo.lock keeps workspace CI deterministic.
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ratatui = { version = "0.30", default-features = false, features = ["underline-color"] }
tempfile = "3.27"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tailrocks/tui-snap"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.test]
# D07: only the two shipping crates remain, so test builds keep line
# tables only (failure backtraces stay file:line-accurate).
# Dev/release profiles keep full debuginfo.
debug = "line-tables-only"

# Provisional fork dependency (§23.1, D-R02-1): our maintained fork
# carries the accepted upstream APIs until the PRs merge and a registry
# release exists. Pinned to the full commit SHA; remove at R02 adoption.
[patch.crates-io]
tui-test-rs = { git = "https://github.com/donbeave/tui-test", rev = "3740cddd9c4aebfcaff82c9191d3a68309d45497" }
