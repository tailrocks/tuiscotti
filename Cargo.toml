[workspace]
members = [
    "crates/tuiscotti",
    "crates/tuiscotti-cli",
]
resolver = "3"

[workspace.dependencies]
# Centralize all actual dependencies here, including dev/build dependencies.
# Only the two shipping crates remain. Live PTY work belongs to
# `tui-test-rs` (provisional pinned fork commit per D-R02-1, never the
# last vendor dependency);
# tuiscotti keeps no local PTY dependency. Compatible SemVer ranges let
# downstream consumers unify dependencies without forced downgrades,
# while Cargo.lock keeps workspace CI deterministic.
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ratatui = { version = "0.30", default-features = false, features = ["underline-color"] }
tempfile = "3.27"
toml = "0.9"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/tailrocks/tuiscotti"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = "deny"
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.test]
# Only the two shipping crates remain, so test builds keep line
# tables only (failure backtraces stay file:line-accurate).
# Dev/release profiles keep full debuginfo.
debug = "line-tables-only"

# Snapshot/render/pixel APIs come from the `tuiscotti-tui-test 0.2.0`
# registry release (renamed fork of tui-test-rs; lib name is still
# `tui_test`). R02 now means switching the dependency name back to
# upstream `tui-test-rs` once its registry release carries the APIs.
