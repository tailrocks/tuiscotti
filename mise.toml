[tools]
gh = "2.103.3"
shellcheck = "0.11.0"
jactionlint = "2.4.0"
"aqua:release-plz/release-plz" = "0.4.3"
mr-boxington = "1.29.2"
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
], mr_boxington = true }
"github:asamarts/alint" = "0.22.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
# velnor-gen writes the CI workflows. Linux takes the release asset. The
# release has no macOS asset, so macOS builds the same commit from source.
# The version here must equal the version in .velnor/rust-ci.lock.
# Bump both with `velnor-gen pin-helper <version>`.
# mise.lock points the linux-arm64 rows at the aarch64 archive by hand: one
# asset_pattern cannot name an archive per architecture, so `mise lock` writes
# the x86_64 archive there. Rerun the fix after every `mise lock`.
"github:tailrocks/velnor-new" = { version = "tools-v0.1.116", asset_pattern = "velnor-gen-*-unknown-linux-musl.tar.gz", os = ["linux"] }
"cargo:https://github.com/tailrocks/velnor-new" = { version = "rev:5e3c38d6eca734106e0f2b0e677f9191be26c012", crate = "velnor-gen", os = ["macos"] }

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.alint]
description = "Repo shape and line gates: alint check at the repo root (local only; not emitted into generated CI)"
run = "alint check"

[tasks.ci-rustdoc]
description = "Rustdoc gate: workspace docs build with warnings denied"
run = 'RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked'

[tasks.ci-no-default]
description = "No-default gate: pure-view builds, lints, tests, no direct PTY/engine dep, and pure-view starts no child/device"
run = [
  "cargo check --workspace --no-default-features --locked --all-targets",
  "cargo clippy --workspace --no-default-features --locked --all-targets -- -D warnings",
  "cargo nextest run --workspace --no-default-features --locked",
  "mise run ci-no-default-graph",
]

[tasks.ci-no-default-graph]
description = "Pty-free negative guard: tuiscotti has no DIRECT portable-pty/alacritty_terminal/termpane dep (they stay permitted as upstream-transitive via tui-test-rs), and the pure-view path starts no child process or device"
run = [
  "cargo nextest run --locked -p tuiscotti-cli --test repository_policy",
  'grep -rE "Command::new|Stdio::|openpty|/dev/(pts|tty|ptmx)|std::process::Command" crates/tuiscotti/src/view.rs crates/tuiscotti/src/view && exit 1 || true',
]

[tasks.ci-deny]
description = "Dependency policy gate: cargo-deny advisories/bans/licenses/sources (pinned github:EmbarkStudios/cargo-deny)"
run = "cargo deny check"

[tasks.ci-check-all-features]
description = "Check and lint the workspace with --all-features"
run = [
  "cargo check --workspace --locked --all-targets --all-features",
  "cargo clippy --workspace --locked --all-targets --all-features -- -D warnings",
]

[tasks.ci-msrv]
description = "MSRV gate: 1.99.1 (the declared rust-version floor) builds and tests all"
run = [
  "cargo check --workspace --locked --all-targets --all-features",
  "cargo nextest run --workspace --locked --all-features",
]

[tasks.ci-generated]
description = "Fail when a generated workflow differs from velnor-gen output"
run = "velnor-gen --root . check"
