[package]
name = "tuiscotti"
version = "0.4.1"
description = "Rust TUI visual-regression toolkit: pure-view capture, versioned samples, frozen checks, approval, reports"
readme = "README.md"
keywords = ["tui", "ratatui", "snapshot-testing", "visual-regression", "terminal"]
categories = ["development-tools", "visualization"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests/benches/*.png"]

[dependencies]
# Pure-view execution. Live sessions, input, locators, waits, capture,
# rendering, and comparison all come from the `tuiscotti-tui-test` snapshot
# model (registry release of the maintained fork; lib name `tui_test`);
# tuiscotti adds the Ratatui view conversion plus the sample, check,
# approval, and report workflow around it. No PTY, renderer, engine, or
# approval-adapter dependency remains downstream.
tuiscotti-tui-test = { version = "0.2.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
# D02 sample format: Protobuf payloads, digests, PNG decoding for evidence.
base64.workspace = true
# D04 approval locking: OS file locks on the stable lock file.
fs2.workspace = true
image.workspace = true
bitflags.workspace = true
crc32fast.workspace = true
flate2.workspace = true
simd-adler32.workspace = true
zstd-safe.workspace = true
zstd-sys.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
base64.workspace = true
approx.workspace = true
byteorder.workspace = true
glob.workspace = true
miniz_oxide.workspace = true
rand.workspace = true
# D04 cross-process lock tests hold the same stable lock file through `fs2`.
fs2.workspace = true
image.workspace = true
ratatui.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
