[package]
name = "tuiscotti"
version = "0.4.0"
description = "Rust TUI visual-regression toolkit: pure-view capture, versioned samples, frozen checks, approval, reports"
readme = "README.md"
keywords = ["tui", "ratatui", "snapshot-testing", "visual-regression", "terminal"]
categories = ["development-tools", "visualization"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
test = false

[dependencies]
# Pure-view execution. Live sessions, input, locators, waits, capture,
# rendering, and comparison all come from the upstream `tui-test-rs` snapshot
# model; tuiscotti adds the Ratatui view conversion plus the sample, check,
# approval, and report workflow around it. No PTY, renderer, engine, or
# approval-adapter dependency remains downstream.
tui-test-rs = { version = "0.1.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
# D02 sample format: canonical JSON, digests, PNG decoding for evidence.
base64.workspace = true
# D04 approval locking: OS file locks on the stable lock file.
fs2.workspace = true
image.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
base64.workspace = true
# D04 cross-process lock tests hold the same stable lock file through `fs2`.
fs2.workspace = true
image.workspace = true
ratatui.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
