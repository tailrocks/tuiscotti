[package]
name = "tuiscotti"
version = "0.2.0"
description = "Rust TUI visual-regression toolkit (facade)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pty"]
pty = ["tuiscotti-runtime/pty"]
# Forwards the runtime's test-only overrides (F12). Test builds only.
test-overrides = ["tuiscotti-runtime/test-overrides"]

[dependencies]
# D01 migration path: Ratatui view capture converts into the single upstream
# snapshot model. The `tui-test-rs` version tracks the release record; the
# unpublished snapshot APIs resolve through the temporary patch procedure in
# GOAL Section 23.1 (explicit `--config` patch arguments, never committed).
tui-test-rs = { version = "0.1.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
# D02 sample format: canonical JSON, digests, PNG decoding for evidence.
base64.workspace = true
image.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tuiscotti-core = { version = "0.2.0", path = "../tuiscotti-core" }
tuiscotti-render = { version = "0.2.0", path = "../tuiscotti-render" }
# default-features = false: the facade `pty` feature (default on) re-adds the
# terminal runtime explicitly, so `--no-default-features` builds pure-view use
# without PTY dependencies.
tuiscotti-runtime = { version = "0.2.0", path = "../tuiscotti-runtime", default-features = false }
tuiscotti-insta = { version = "0.2.0", path = "../tuiscotti-insta" }

[dev-dependencies]
base64.workspace = true
image.workspace = true
insta.workspace = true
ratatui.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
