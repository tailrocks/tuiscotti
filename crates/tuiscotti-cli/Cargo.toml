[package]
name = "tuiscotti-cli"
version = "0.4.1"
description = "Offline CLI for tuiscotti visual snapshots: check, accept, render, report"
readme = "README.md"
keywords = ["tui", "ratatui", "snapshot-testing", "visual-regression", "terminal"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests/repository_policy.rs", "tests/schema_generator.rs"]

[[bin]]
name = "tuiscotti"
path = "src/main.rs"
# The bin shares its name with the `tuiscotti` facade lib; documenting both
# collides at target/doc/tuiscotti/index.html (cargo#6313). The bin carries no
# library API, so only the lib is documented.
doc = false

[dependencies]
# The facade ships no PTY, engine, or renderer, so the offline commands
# (check, accept, render, report) never start an application or open a
# terminal device. State-only render replays the pinned renderer through
# the `tuiscotti-tui-test` API.
tuiscotti = { version = "0.4.1", path = "../tuiscotti" }
tuiscotti-tui-test = { version = "0.2.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
base64.workspace = true
clap.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
prost = "=0.14.4"
prost-types = "=0.14.4"
protoc-bin-vendored = "=3.3.0"
tuiscotti = { version = "0.4.1", path = "../tuiscotti" }
tuiscotti-tui-test = { version = "0.2.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
base64.workspace = true
flate2.workspace = true
ratatui.workspace = true
image.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
zstd-safe.workspace = true

[lints]
workspace = true
