[package]
name = "tuiscotti-cli"
version = "0.2.0"
description = "Offline CLI for tuiscotti visual snapshots: check, accept, render, report"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tuiscotti"
path = "src/main.rs"
# The bin shares its name with the `tuiscotti` facade lib; documenting both
# collides at target/doc/tuiscotti/index.html (cargo#6313). The bin carries no
# library API, so only the lib is documented.
doc = false

[dependencies]
# D07: the facade ships no PTY, engine, or renderer, so the offline commands
# (check, accept, render, report) never start an application or open a
# terminal device. State-only render replays the pinned renderer through
# the upstream API.
tuiscotti = { version = "0.2.0", path = "../tuiscotti" }
tui-test-rs = { version = "0.1.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
base64.workspace = true
clap.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tuiscotti = { version = "0.2.0", path = "../tuiscotti" }
tui-test-rs = { version = "0.1.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
base64.workspace = true
image.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
