# tuiscotti nextest configuration (N02-N10).
# Default profile: plain `cargo nextest run` fast lane.
# CI profile: no retries (failures stay visible), JUnit for evidence
# correlation, leaky PTY tests fail instead of passing silently.

[profile.default]
fail-fast = false
retries = 0

[profile.ci]
fail-fast = false
retries = 0
flaky-result = "fail"
leak-timeout = { period = "500ms", result = "fail" }

[profile.ci.junit]
path = "junit.xml"

[test-groups]
# Genuinely scarce resource: concurrent PTY sessions. D07 removed the local
# engine and its PTY test binaries; only `session_migration` still opens
# live upstream sessions, so it alone joins this group.
terminal-e2e = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(session_migration)'
test-group = 'terminal-e2e'

[[profile.ci.overrides]]
filter = 'binary(session_migration)'
test-group = 'terminal-e2e'
