[advisories]
ignore = [
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/donbeave/tui-test"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # MPL-2.0 solely for `option-ext` 0.2.0, pulled transitively via
    # `dirs-sys <- dirs <- tui-test-rs` (unavoidable upstream dep of the
    # provisional fork pin). Retire this entry only if the upstream
    # dependency graph drops `option-ext` (e.g. dirs/tui-test-rs remove
    # the dependency and `cargo deny check licenses` stays green without it).
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
