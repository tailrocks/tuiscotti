# Tuiscotti deny.toml (G7 appendix, updated for ratatui 0.30). Target: <repo-root>/deny.toml
[advisories]
# ratatui 0.30 migrated from `paste` to `pastey` and bumped `lru` to >=0.18.2,
# eliminating both `RUSTSEC-2024-0436` (`paste` unmaintained) and the older
# `lru` 0.12.x unsoundness advisories (`RUSTSEC-2026-0002` / `-0253`).
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# R26 provisional-fork exception, REMOVE AT R02: the workspace
# [patch.crates-io] pins tui-test-rs to our maintained fork until the
# upstream PRs merge and a registry release exists (D-R02-1). This is the
# only permitted git source; source validation stays deny-by-default.
allow-git = ["https://github.com/donbeave/tui-test"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
